<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0" />

  <title>hundred.one</title>

  <meta
    name="description"
    content="hundred.one — premium domain available for acquisition." />

  <meta
    name="color-scheme"
    content="dark" />

  <link
    rel="canonical"
    href="https://hundred.one" />

  <!-- Open Graph -->
  <meta property="og:title" content="hundred.one" />

  <meta
    property="og:description"
    content="From 100 ideas to the one that matters." />

  <meta
    property="og:type"
    content="website" />

  <meta
    property="og:url"
    content="https://hundred.one" />

  <!-- Twitter -->
  <meta
    name="twitter:card"
    content="summary_large_image" />

  <meta
    name="twitter:title"
    content="hundred.one" />

  <meta
    name="twitter:description"
    content="From 100 ideas to the one that matters." />

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="favicon.svg" />

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #050505;
      --text: #ffffff;
      --muted: #7d7d7d;
      --border: #1b1b1b;
      --card: #0d0d0d;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px 20px;

      background:
        radial-gradient(
          circle at top,
          rgba(255,255,255,0.03),
          transparent 55%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;

      overflow-x: hidden;

      animation:
        fadeIn 1.2s cubic-bezier(0.22,1,0.36,1);
    }

    body::after {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      opacity: 0.025;

      background-image:
        radial-gradient(
          rgba(255,255,255,0.35) 0.5px,
          transparent 0.5px
        );

      background-size: 3px 3px;
    }

    .container {
      width: 100%;
      max-width: 460px;

      text-align: center;
    }

    .logo-float {
      display: flex;
      justify-content: center;

      will-change: transform;

      transform: translateZ(0);

      animation:
        float 7s ease-in-out infinite;
    }

    .logo {
      width: 160px;
      height: auto;

      display: block;

      margin: 0 auto 12px;

      opacity: 0;

      transform:
        translateY(8px)
        translateZ(0);

      will-change:
        transform,
        opacity;

      animation:
        reveal 1s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    .domain-name {
      margin-top: -2px;
      margin-bottom: 28px;

      font-size: 18px;
      font-weight: 600;

      letter-spacing: -0.03em;

      color: rgba(255,255,255,0.92);

      opacity: 0;

      transform: translateY(6px);

      animation:
        reveal 1s ease forwards;

      animation-delay: 0.08s;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .tagline {
      margin-bottom: 16px;

      font-size: 22px;
      font-weight: 500;
      line-height: 1.45;

      letter-spacing: -0.4px;

      opacity: 0;

      transform: translateY(6px);

      animation:
        reveal 1s ease forwards;

      animation-delay: 0.15s;
    }

    .tagline span {
      opacity: 0.92;
    }

    .subline {
      margin-bottom: 40px;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.6;

      opacity: 0;

      transform: translateY(6px);

      animation:
        reveal 1s ease forwards;

      animation-delay: 0.3s;
    }

    .divider {
      width: 72px;
      height: 1px;

      margin: 0 auto 40px;

      background: #242424;

      opacity: 0;

      animation:
        fadeOnly 1s ease forwards;

      animation-delay: 0.45s;
    }

    form {
      position: relative;

      display: flex;
      flex-direction: column;

      gap: 14px;

      opacity: 0;

      transform: translateY(8px);

      animation:
        reveal 1s ease forwards;

      animation-delay: 0.55s;
    }

    input,
    textarea {
      width: 100%;

      padding: 16px;

      border-radius: 14px;
      border: 1px solid var(--border);

      background: var(--card);

      color: #fff;

      font-size: 15px;

      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: #666;
    }

    input:hover,
    textarea:hover {
      border-color: #2b2b2b;
    }

    input:focus,
    textarea:focus {
      outline: none;

      border-color: #3a3a3a;

      background: #111;

      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 0 18px rgba(255,255,255,0.03);
    }

    textarea {
      min-height: 90px;

      resize: vertical;
    }

    button {
      padding: 14px;

      border: none;
      border-radius: 14px;

      background: #fff;
      color: #000;

      font-size: 15px;
      font-weight: 600;

      letter-spacing: -0.02em;

      cursor: pointer;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    button:hover {
      opacity: 0.92;

      transform: translateY(-1px);

      box-shadow:
        0 8px 30px rgba(255,255,255,0.06);
    }

    .form-status {
      min-height: 18px;

      margin-top: 2px;

      color: #7d7d7d;

      font-size: 13px;
    }

    .footer {
      margin-top: 18px;

      color: #5f5f5f;

      font-size: 12px;
      line-height: 1.5;

      opacity: 0;

      animation:
        fadeOnly 1s ease forwards;

      animation-delay: 0.7s;
    }

    @keyframes reveal {
      to {
        opacity: 1;
        transform:
          translateY(0)
          translateZ(0);
      }
    }

    @keyframes fadeOnly {
      to {
        opacity: 1;
      }
    }

    @keyframes float {
      0%, 100% {
        transform:
          translateY(0)
          translateZ(0);
      }

      50% {
        transform:
          translateY(-4px)
          translateZ(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @media (max-width: 480px) {

      body {
        padding: 28px 18px;
      }

      .logo {
        width: 130px;
      }

      .tagline {
        font-size: 18px;
      }

      .domain-name {
        font-size: 16px;
      }

      input,
      textarea,
      button {
        font-size: 16px;
      }
    }

  </style>

</head>

<body>

  <main class="container">

    <!-- logo -->
    <div class="logo-float">

      <img
        src="logo.svg"
        alt="hundred.one logo"
        class="logo" />

    </div>

    <!-- domain -->
    <div class="domain-name">
      hundred.one
    </div>

    <!-- SEO heading -->
    <h1 class="sr-only">
      hundred.one
    </h1>

    <!-- tagline -->
    <div class="tagline">
      From 100 ideas to the <span>ONE</span> that matters.
    </div>

    <!-- subline -->
    <div class="subline">
      Available for acquisition.
    </div>

    <div class="divider"></div>

    <form id="contactForm">

      <input
        id="email"
        type="email"
        name="email"
        placeholder="Your email"
        autocomplete="email"
        required />

      <textarea
        id="offer"
        name="offer"
        placeholder="Offer or inquiry"
        required></textarea>

      <button
        type="submit"
        id="submitButton">
        Inquire
      </button>

      <div
        class="form-status"
        id="formStatus"
        aria-live="polite"></div>

    </form>

    <div class="footer">
      Private acquisition inquiries.
    </div>

  </main>

</body>
</html>
