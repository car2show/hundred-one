<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>hundred.one</title>

  <meta
    name="description"
    content="hundred.one — premium domain available for acquisition." />

  <link rel="canonical" href="https://hundred.one" />

  <!-- Open Graph -->
  <meta property="og:title" content="hundred.one" />
  <meta
    property="og:description"
    content="From 100 ideas to the one that matters." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://hundred.one" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="hundred.one" />
  <meta
    name="twitter:description"
    content="From 100 ideas to the one that matters." />

  <!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #050505;
      --text: #ffffff;
      --muted: #7d7d7d;
      --border: #1b1b1b;
      --card: #0d0d0d;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px 20px;

      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .container {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .logo {
      width: 160px;
      display: block;
      margin: 0 auto 20px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .tagline {
      margin-bottom: 16px;

      font-size: 22px;
      font-weight: 500;
      line-height: 1.45;
      letter-spacing: -0.4px;
    }

    .subline {
      margin-bottom: 40px;

      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .divider {
      width: 72px;
      height: 1px;
      margin: 0 auto 40px;
      background: #242424;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    input,
    textarea {
      width: 100%;
      padding: 16px;

      border-radius: 14px;
      border: 1px solid var(--border);

      background: var(--card);
      color: #fff;

      font-size: 15px;

      transition:
        border-color 0.2s ease,
        background 0.2s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: #666;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #3a3a3a;
      background: #111;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      padding: 14px;

      border: none;
      border-radius: 14px;

      background: #fff;
      color: #000;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    button:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .footer {
      margin-top: 18px;

      color: #5f5f5f;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      body {
        padding: 28px 18px;
      }

      .logo {
        width: 130px;
      }

      .tagline {
        font-size: 18px;
      }

      input,
      textarea,
      button {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- logo -->
    <img
      src="logo.png"
      alt="hundred.one logo"
      class="logo" />

    <!-- SEO heading -->
    <h1 class="sr-only">
      hundred.one
    </h1>

    <!-- tagline -->
    <div class="tagline">
      From 100 ideas to the <span>ONE</span> that matters.
    </div>

    <!-- subline -->
    <div class="subline">
      Available for acquisition.
    </div>

    <div class="divider"></div>

<form
  action="https://formspree.io/f/xaqklgeg"
  method="POST">

  <!-- email -->
  <label for="email" class="sr-only">
    Email
  </label>

  <input
    id="email"
    type="email"
    name="email"
    placeholder="Your email"
    autocomplete="email"
    required />

  <!-- offer -->
  <label for="offer" class="sr-only">
    Offer
  </label>

  <textarea
    id="offer"
    name="offer"
    placeholder="Offer or inquiry"
    required></textarea>

  <!-- button -->
  <button type="submit">
    Submit inquiry
  </button>

</form>

    <div class="footer">
      Serious inquiries only.
    </div>

  </main>

</body>
</html>
